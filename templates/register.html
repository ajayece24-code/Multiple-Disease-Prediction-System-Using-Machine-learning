{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | CardioScreen AI</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body class="app-bg">

<div class="auth-wrapper">
    <div class="card auth-card">
        <div class="brand" style="margin-bottom: 14px;">
            <span class="dot"></span>
            <span>CardioScreen AI</span>
        </div>
        <h2>Create Account</h2>
        <p class="moto">Register to save your screening session and use the health assistant.</p>

        <form method="post">
            {% csrf_token %}

            <div class="field">
                <label for="id_username">Username</label>
                <input id="id_username" type="text" name="username" placeholder="Choose a username" required>
            </div>

            <div class="field">
                <label for="id_password">Password (min 6 characters)</label>
                <input id="id_password" type="password" name="password" minlength="6" placeholder="Create a password" required>
            </div>

            {% if error %}
                <p class="error" role="alert">{{ error }}</p>
            {% endif %}

            <button class="predict-btn" type="submit">Register</button>
        </form>

        <p class="switch">
            Already have an account? <a href="{% url 'login' %}">Sign in</a>
        </p>
    </div>
</div>

</body>
</html>
